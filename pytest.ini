[pytest]
minversion = 7.0
addopts = -ra -q
testpaths = tests
python_files = test_*.py *_test.py

# ---------------------------------------------------------------------------
# Custom markers
# ---------------------------------------------------------------------------
markers =
    slow:      marks tests as slow-running (deselect with -m "not slow")
    stress:    marks tests as stress/chaos tests (implies slow; use --timeout=300)
    benchmark: marks tests as throughput/latency benchmarks

# ---------------------------------------------------------------------------
# Timeout (requires pytest-timeout)
# ---------------------------------------------------------------------------
timeout = 120

# ---------------------------------------------------------------------------
# pytest-benchmark (if installed)
# ---------------------------------------------------------------------------
# benchmark_min_rounds = 5
# benchmark_warmup = on
# benchmark_disable_gc = true
# benchmark_sort = name

