# Example configuration for IntegrationController
# Save as configs/default.yaml

# Operating mode: training, evaluation, deployment, or demo
mode: training

# Output directory for results and checkpoints
output_dir: results/default_run

# Model paths (optional)
markov_model_path: null  # Path to pre-trained Markov model
agent_model_path: null   # Path to pre-trained agent

# Enable optional features
enable_monitoring: true  # Prometheus metrics
enable_api: true        # REST API
log_level: INFO         # DEBUG, INFO, WARNING, ERROR

# API configuration
api_host: 0.0.0.0
api_port: 8080

# Environment configuration
env_config:
  max_steps_per_episode: 200
  use_real_services: false
  episode_end_on_cascade: true
  normalize_rewards: false
  seed: 42

  # Simulator settings
  simulator_config:
    num_apis: 20
    user_types: [guest, free, premium]
    session_length_range: [10, 100]
    cascade_threshold: 0.8
    base_latency_ms: 50.0
    cache_hit_latency_ms: 5.0

# Agent configuration
agent_config:
  # Architecture
  hidden_dims: [128, 128]
  activation: relu

  # Training
  learning_rate: 0.0001
  batch_size: 64
  buffer_size: 100000

  # Exploration
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay: 0.995

  # Target network
  target_update_frequency: 1000
  tau: 0.005  # Soft update weight

  # Training
  gamma: 0.99  # Discount factor
  gradient_clip: 10.0

# Training configuration
training_config:
  num_episodes: 1000
  eval_frequency: 50      # Evaluate every N episodes
  save_frequency: 100     # Save checkpoint every N episodes

  # Early stopping
  early_stopping: true
  patience: 100
  min_improvement: 0.01

  # Logging
  log_frequency: 10
  tensorboard: true
  wandb: false

